[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akpack"
version = "0.1.0"
description = "Portable lossless archive format with exact restoration"
requires-python = ">=3.11"
dependencies = [
  "zstandard>=0.23",
  "brotli>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
]

[project.scripts]
akp = "cli.main:app"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "server*"]
exclude = ["web*", "tests*", "benchmarks*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]